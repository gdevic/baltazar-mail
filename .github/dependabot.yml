# Keeps the actions used by the workflows current. The workflows name each action by the commit
# of a release, with the release in a comment, so a moved tag cannot change what runs; Dependabot
# moves both to a newer release. The bundled libraries in ext/vendor are not npm dependencies;
# tools/vendor-check.mjs and the "Bundled libraries" workflow watch those.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
