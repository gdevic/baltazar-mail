# All test suites: the unit tests and the bundled-library hashes, then the built Yahoo extension in
# Playwright's Chromium against a mocked Yahoo (smoke.js, yahoo-runtime.js) and the built Gmail
# extension against a mocked Gmail (gmail-runtime.js), and beside them the scenarios of review.js,
# the security regressions among them, in shards. Each suite builds what it tests. Runs on every
# push to main and every pull request, before every release, and from the Actions tab.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tests import ext/*.js and the built adapters as ES modules without a package.json,
      # which needs Node's module-syntax detection (Node 22.7 and later).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Unit tests
        run: |
          node --version
          for t in tools/*-test.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      - name: Bundled libraries match their recorded hashes
        run: node tools/vendor-check.mjs

      # The version every test has been run with; not saved to the repository.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: node tools/smoke.js

      - name: Yahoo runtime test (the built Yahoo extension)
        run: node tools/yahoo-runtime.js

      - name: Gmail runtime test (the built Gmail extension)
        run: node tools/gmail-runtime.js

  # Each scenario of review.js runs on a fresh profile, so a shard is every fourth of them.
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Review scenarios (the built Yahoo and Gmail extensions)
        env:
          SHARD: ${{ matrix.shard }}
        run: node tools/review.js "--shard=$SHARD/4"
