# Publishes a GitHub release whose asset is a ZIP of the extension: unzip it anywhere and load
# the folder inside with "Load unpacked". Runs when a v* tag is pushed, or from the Actions tab
# (Run workflow) with a tag name, which then tags the selected branch.
# The tag must match the version in ext/manifest.json, e.g. v0.13.4.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.13.4 (must match ext/manifest.json)"
        required: true

permissions:
  contents: write
  id-token: write        # signs the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(jq -er .version ext/manifest.json)
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match ext/manifest.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check bundled libraries
        run: node tools/vendor-check.mjs --upstream --osv

      - name: Package
        run: |
          # The folder inside is always "baltazar-mail": the browser ties an unpacked extension (and
          # its settings and address book) to its folder path, so updates unzip over the same folder.
          zipname="baltazar-mail-${{ steps.ver.outputs.version }}.zip"
          mkdir -p dist/baltazar-mail
          cp -r ext/. dist/baltazar-mail/
          find dist/baltazar-mail -name '.DS_Store' -delete
          cp LICENSE dist/baltazar-mail/LICENSE
          cd dist
          zip -qr9 "$zipname" baltazar-mail
          unzip -l "$zipname" | grep -q " baltazar-mail/manifest.json$"
          sha256sum "$zipname" > "$zipname.sha256"

      - name: Record build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/baltazar-mail-${{ steps.ver.outputs.version }}.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          cat > notes.md <<NOTES
          ### Install
          1. Download **baltazar-mail-$version.zip** below and unzip it into a folder you will keep, such as Documents; it contains one folder, \`baltazar-mail\`.
          2. Open \`edge://extensions\` (or \`chrome://extensions\`) and turn on **Developer mode**.
          3. Click **Load unpacked** and select the \`baltazar-mail\` folder.
          4. Be signed in to mail.yahoo.com in the same browser profile, then click the Baltazar Mail toolbar icon.

          ### Verify (optional)
          This ZIP was built by GitHub Actions from the tagged commit, and GitHub signed a record of that. With the GitHub CLI: \`gh attestation verify baltazar-mail-$version.zip -R ${{ github.repository }}\`

          ### Update
          Unzip the new release over the same \`baltazar-mail\` folder, replacing the files, then click **Reload** on the Baltazar Mail card in the extensions page. Do not remove the extension to update it: removing deletes its settings and address book.

          NOTES
          gh release create "$tag" dist/*.zip dist/*.zip.sha256 \
            --title "Baltazar Mail $version" --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
