# Publishes a GitHub release whose asset is a ZIP of the extension: unzip it anywhere and load
# the folder inside with "Load unpacked". Runs when a v* tag is pushed, or from the Actions tab
# (Run workflow) with a tag name, which then tags the selected branch.
# The tag must match the version in ext/manifest.json, e.g. v0.13.4. A manual run must start from
# main, and a tag that already exists must point at the commit being built. Those checks come
# first; nothing is published unless every test suite passes after them (tests.yml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.13.4 (must match ext/manifest.json)"
        required: true

permissions:
  contents: write
  id-token: write        # signs the build provenance
  attestations: write

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # with tags, to see whether the release tag already exists

      # Values from the tag reach the shell only through environment variables, never by
      # expansion into the script text, and the tag must look like a version.
      - name: Check version, branch and tag
        id: ver
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: tools/release-check.sh

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: [check, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check bundled libraries
        run: node tools/vendor-check.mjs --upstream --osv

      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The folder inside is always "baltazar-mail": the browser ties an unpacked extension (and
          # its settings and address book) to its folder path, so updates unzip over the same folder.
          zipname="baltazar-mail-$VERSION.zip"
          mkdir -p dist/baltazar-mail
          cp -r ext/. dist/baltazar-mail/
          find dist/baltazar-mail -name '.DS_Store' -delete
          cp LICENSE dist/baltazar-mail/LICENSE
          cd dist
          zip -qr9 "$zipname" baltazar-mail
          unzip -l "$zipname" | grep -q " baltazar-mail/manifest.json$"
          sha256sum "$zipname" > "$zipname.sha256"
          # The same files with manifest.json at the top level, as browser stores require.
          storename="baltazar-mail-$VERSION-store.zip"
          (cd baltazar-mail && zip -qr9 "../$storename" .)
          unzip -l "$storename" | grep -q " manifest.json$"
          sha256sum "$storename" > "$storename.sha256"

      - name: Record build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/baltazar-mail-${{ needs.check.outputs.version }}.zip
            dist/baltazar-mail-${{ needs.check.outputs.version }}-store.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          tag="$TAG"
          version="$VERSION"
          cat > notes.md <<NOTES
          ### Install
          1. Download **baltazar-mail-$version.zip** below and unzip it into a folder you will keep, such as Documents; it contains one folder, \`baltazar-mail\`.
          2. Open \`edge://extensions\` (or \`chrome://extensions\`) and turn on **Developer mode**.
          3. Click **Load unpacked** and select the \`baltazar-mail\` folder.
          4. Be signed in to mail.yahoo.com in the same browser profile, then click the Baltazar Mail toolbar icon.

          ### Verify (optional)
          This ZIP was built by GitHub Actions from the tagged commit, and GitHub signed a record of that. With the GitHub CLI: \`gh attestation verify baltazar-mail-$version.zip -R $REPO\`

          The \`-store.zip\` asset holds the same files with \`manifest.json\` at the top level, as uploaded to browser stores; to install by hand, use the other ZIP.

          ### Update
          Unzip the new release over the same \`baltazar-mail\` folder, replacing the files, then click **Reload** on the Baltazar Mail card in the extensions page. Do not remove the extension to update it: removing deletes its settings and address book.

          NOTES
          gh release create "$tag" dist/*.zip dist/*.zip.sha256 \
            --title "Baltazar Mail $version" --notes-file notes.md --generate-notes --target "$GITHUB_SHA"
