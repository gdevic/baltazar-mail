# GitHub code scanning with CodeQL: the extension's JavaScript and these workflow files.
# Bundled libraries are excluded; they are checked against their published sources instead.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - ext/vendor
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
