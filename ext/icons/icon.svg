<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3038"/><stop offset="1" stop-color="#15181c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c060"/><stop offset="1" stop-color="#c98f2c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#3a424c" stroke-width="1"/>
  <!-- envelope body -->
  <rect x="24" y="38" width="80" height="54" rx="8" fill="url(#gold)"/>
  <!-- flap -->
  <path d="M24 46 L64 72 L104 46" fill="none" stroke="#15181c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bottom fold lines -->
  <path d="M30 88 L52 66 M98 88 L76 66" fill="none" stroke="#15181c" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <!-- speed dash -->
  <path d="M12 60 h8 M8 72 h12 M12 84 h8" stroke="#f0c060" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
</svg>
